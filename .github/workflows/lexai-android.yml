name: Build LexAI Android APK

on:
  push:
    branches: [lexai-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lexai-latvia-mvp/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore LexAI source
        shell: bash
        run: |
          base64 -d lexai-src.b64 > lexai.zip
          unzip -q lexai.zip

      - name: Install dependencies
        working-directory: lexai-latvia-mvp/mobile
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: lexai-latvia-mvp/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build standalone release APK
        working-directory: lexai-latvia-mvp/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          cp lexai-latvia-mvp/mobile/android/app/build/outputs/apk/release/app-release.apk LexAI-Latvia.apk
          ls -lh LexAI-Latvia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LexAI-Latvia-APK
          path: LexAI-Latvia.apk
          if-no-files-found: error
